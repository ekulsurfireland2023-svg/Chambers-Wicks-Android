apply plugin: 'com.android.application'

android {
    namespace 'com.chamberswicks.charts'
    compileSdk 36

    defaultConfig {
        applicationId 'com.chamberswicks.charts'
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName '1.0'
    }

    // Fixed key kept in the project so the app's fingerprint never changes
    // (the website's assetlinks.json is matched to this exact key).
    signingConfigs {
        fixed {
            storeFile file('../keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
}
